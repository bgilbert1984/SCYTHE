# spectrcyde.com: SCYTHE app surface on the orchestrator (127.0.0.1:5001),
# everything else to WordPress (127.0.0.1:8080).
#
# Install: sudo cp deploy/nginx-spectrcyde-auth.conf /etc/nginx/conf.d/00-spectrcyde-auth.conf
#          sudo cp deploy/scythe-proxy-headers.conf  /etc/nginx/snippets/scythe-proxy-headers.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# Requires the `map $http_upgrade $connection_upgrade` block that
# /etc/nginx/conf.d/scythe.conf defines (used for WebSocket upgrades below).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name spectrcyde.com www.spectrcyde.com;

    ssl_certificate /etc/letsencrypt/live/spectrcyde.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectrcyde.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512m;

    # Top-level SCYTHE pages: login.html, register.html, forgot-password.html,
    # reset-password.html, rf_scythe_home.html (post-login home),
    # user_account.html, command-ops-visualization.html and the demo pages.
    # WordPress does not serve *.html at the root, so a regex on the extension
    # is a clean split; it outranks the plain `location /` prefix below.
    location ~* ^/[^/]+\.html$ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
    }

    # Per-instance realms (/scythe/i/<id>/...), port proxies and Socket.IO:
    # long-lived WebSocket connections, so upgrade headers and a long timeout.
    location ^~ /scythe/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /proxy/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # WordPress
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/scythe-proxy-headers.conf;
        proxy_read_timeout 300s;
    }
}
