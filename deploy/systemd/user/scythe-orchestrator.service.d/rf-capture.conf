# RF capture parameters, shared with scythe-rtl-tcp.service.
#
# rtl_tcp -s is the only authority for the rate the hardware actually runs;
# SDRPP_SAMPLE_RATE_HZ is only what rf_bridge DECLARES, and it drives
# bin_width = sample_rate_hz / fft_size. If the two ever disagreed, every
# frequency label in the trace would be wrong with no error raised. One file,
# both consumers, so they cannot disagree.
#
# No leading "-" on EnvironmentFile: if the file is missing the orchestrator
# refuses to start rather than silently falling back to rf_bridge's
# 1_000_000 Hz default and mislabelling the axis.
[Service]
EnvironmentFile=%h/.config/scythe/rf-capture.env
