# Install: sudo cp deploy/nginx/scythe.conf /etc/nginx/conf.d/scythe.conf   (nginx -t first)
# /etc/nginx/conf.d/scythe.conf
#
# Everything goes to the orchestrator. There is no dist/ to serve: the Flask
# app itself serves rf_scythe_home.html, command-ops-visualization.html and
# every static asset via its catch-all @app.route('/<path:filename>') handler,
# and reverse-proxies child instances at /scythe/i/<id>/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream scythe_orchestrator {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # command-ops-visualization.html is 2.3 MB and PCAP uploads go through
    # /api/*; the 1 MB default would reject both.
    client_max_body_size 512m;

    # Socket.IO and the /proxy/<port>/ws relays are long-lived. The 60 s
    # default read timeout would cut an idle operator session every minute.
    proxy_read_timeout  1h;
    proxy_send_timeout  1h;

    # Defense in depth: never hand out databases, logs, keys, scripts or dotfiles (.env),
    # even if the application's own allowlist (scythe_static_policy.py) were bypassed.
    # This server block takes every Host that is not spectrcyde.com, so it needs its own
    # rule: the one in nginx-spectrcyde-auth.conf does not apply here. A plain-prefix
    # `location /` loses to a matching regex location, so this can sit at server level.
    location ~* (?:/\.[^/]|\.(?:db|db-wal|db-shm|sqlite3?|log|env|pem|key|py|sh|bak|sql|pcap)/?$) {
        return 404;
    }

    location / {
        proxy_pass http://scythe_orchestrator;
        proxy_http_version 1.1;

        proxy_set_header Upgrade     $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;

        # _public_client_base() reads these to build api_base, ws_base and
        # X-SCYTHE-PUBLIC-BASE in /api/bootstrap.js. Without them every
        # instance URL the browser is handed points at 127.0.0.1:5001.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE endpoints under /stream/* must not sit in a proxy buffer.
        proxy_buffering off;
    }
}
