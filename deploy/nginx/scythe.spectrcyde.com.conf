# /etc/nginx/conf.d/scythe.spectrcyde.com.conf
#
# HTTPS front door for the SCYTHE orchestrator. The scythe-web demos need a
# secure context: browsers only expose crypto.subtle (used for tile SHA-256
# verification in scythe-web/tileLoader.js) over HTTPS or localhost, so the
# bare-IP port-80 server in scythe.conf cannot run them.
#
# Relies on the `map $http_upgrade $connection_upgrade` and the
# `upstream scythe_orchestrator` blocks defined in scythe.conf.

server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scythe.spectrcyde.com;

    ssl_certificate     /etc/letsencrypt/live/scythe.spectrcyde.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scythe.spectrcyde.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Same limits as scythe.conf: 2.3 MB visualization page, PCAP uploads,
    # and hour-long Socket.IO / /proxy/<port>/ws sessions.
    client_max_body_size 512m;
    proxy_read_timeout  1h;
    proxy_send_timeout  1h;

    location / {
        proxy_pass http://scythe_orchestrator;
        proxy_http_version 1.1;

        proxy_set_header Upgrade     $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;

        # _public_client_base() in scythe_orchestrator.py reads these; with
        # $scheme = https every instance URL it hands the browser is https.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
    }
}

server {
    listen      80;
    listen [::]:80;
    server_name scythe.spectrcyde.com;

    # Keep the ACME path on port 80 so certbot renewals (authenticator=nginx)
    # keep working; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
