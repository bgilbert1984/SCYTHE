name: Repository Hygiene

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject hardcoded feed tokens
        run: tools/preflight_secret_scan.sh

  python-rf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # duckdb + pyarrow: rf_scythe_api_server.py's DuckDB tactical event store
      # (scene_duckdb_store.py) degrades to _duck_store = None without them,
      # which previously went unnoticed because no test_rf_*.py module
      # exercised a route that depends on it -- the ARR-API-2/3 mission_id
      # ingest/query/export tests are the first that do.
      #
      # duckdb is capped below 2: 2.0.0 (unpinned, so CI picked it up on 2026-10-22) makes
      # scene_duckdb_store.append_batch raise ResourceInUseException; lift the cap with the fix.
      - name: Install RF test dependencies
        run: python -m pip install numpy flask Flask-Cors PyJWT requests "duckdb<2" pyarrow
      # Globbed on purpose. A hand-maintained list is how test_rf_signal_family,
      # test_graphops_rf_antenna and test_graphops_rf_tune all shipped without CI
      # coverage; a new test module now joins the run by existing.
      - name: Run RF estimator, bridge, classifier and ledger tests
        # test_scythe_*.py joined the glob when scythe_invariant_ledger landed:
        # it is deliberately domain-agnostic, so it is not test_rf_*, and it
        # would otherwise have shipped without CI coverage -- exactly what the
        # note above says the globbing exists to prevent.
        run: python -m unittest -v test_rf_*.py test_graphops_rf_*.py test_scythe_*.py

  python-graphops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GraphOps test dependencies
        run: python -m pip install numpy flask Flask-Cors PyJWT requests
      - name: Compile GraphOps Python modules
        # Globbed for the same reason the test step above is: scythe_orchestrator
        # was named here by hand, so scythe_invariant_ledger, _capsule and the
        # promotion modules were never compiled by CI at all.
        run: python -m compileall -q rf_*.py graphops_rf_*.py rf_spectrum_contract.py graphops_full_fidelity.py scythe_*.py
      - name: Run GraphOps workbench tests
        run: python -m unittest -v test_graphops_workbench.py test_graphops_rf_ingest.py test_graphops_full_fidelity.py

  python-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Found, not listed, for the same reason the RF globs above are: the
      # cantilever extractor tests lived under mechanics/ and matched none of
      # them, so CI was green without ever running them. Each file runs in its
      # own process because the test modules import their sibling modules by
      # path, and unittest discovery does not descend into directories that
      # are not packages.
      - name: Run mechanics tests
        run: |
          set -e
          files=$(find mechanics -name 'test_*.py' | sort)
          test -n "$files"
          for f in $files; do
            echo "== $f"
            python "$f"
          done

  python-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Three modules need more than the RF jobs install, and only this job
      # pays for it: test_graphops_director imports jsonschema,
      # test_network_measurement_parsing imports psutil, and
      # test_eve_grpc_retry imports grpc and the generated scythe_pb2, which
      # declares protobuf 6.31.1 as its minimum runtime.
      # duckdb + pyarrow: needed by any test module that imports
      # scene_duckdb_store.py directly (see the same note on python-rf above).
      - name: Install platform test dependencies
        run: python -m pip install numpy flask Flask-Cors PyJWT requests psutil jsonschema grpcio "protobuf>=6.31.1" "duckdb<2" pyarrow
      # Named, not globbed. These modules match none of the RF globs above and
      # are not in the GraphOps job's list, so they ran nowhere. The runner
      # fails if a module collects nothing, if collected != executed, or if any
      # test skips: a skip here would be a host gap passing as coverage.
      # A new test_*.py at the repository root is not picked up by this list;
      # add it here, or it joins no job.
      - name: Run platform tests
        run: |
          python tools/ci_run_explicit_tests.py \
            test_eve_graph_ingest \
            test_eve_grpc_retry \
            test_graph_event_fields \
            test_graphfusion \
            test_graphops_address_context \
            test_graphops_authority \
            test_graphops_conversation \
            test_graphops_director \
            test_graphops_explorer \
            test_graphops_external_infrastructure \
            test_graphops_flow_direction \
            test_graphops_flow_evidence \
            test_graphops_tool_effects \
            test_graphops_graph_resolver_mission_filter \
            test_graphops_host_trace \
            test_graphops_infrastructure \
            test_ip_enrichment \
            test_live_mission_binding \
            test_lunar_evidence_resolver \
            test_mcp_approval_action \
            test_mcp_approver_authority \
            test_mcp_restart_policy \
            test_mcp_approval_audit \
            test_mcp_approval_policy \
            test_mcp_halting_action \
            test_mcp_initiator_class \
            test_mcp_lifecycle_invariant \
            test_mcp_orchestrator_registry \
            test_mcp_pending_approval \
            test_mcp_proposal_routes \
            test_mcp_tooldef_parity \
            test_mcp_startup_contract \
            test_mcp_tool_contract \
            test_network_measurement_parsing \
            test_network_tool_policy \
            test_ollama_cloud \
            test_pcap_ingest_mission_id \
            test_pcap_ingest_writebus \
            test_rf_stream_configure_tool \
            test_route_epistemics \
            test_sdr_route_audit \
            test_sdr_route_lifecycle \
            test_scene_duckdb_store_mission_id \
            test_sensor_registry_lpi \
            test_subgraph_diff_mission_predicate \
            test_writebus

  node-scythe-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scythe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scythe-web/package-lock.json
      - run: npm ci
      - run: npm test

  node-root-js:
    runs-on: ubuntu-latest
    # Root-level JS files (cesium-hypergraph-globe.js, unified-render-scheduler.js, this one)
    # have no package.json and are not part of the scythe-web app above -- node --test needs
    # neither. Named, not globbed, for the same reason the Python explicit-test jobs are: a new
    # *.test.js at the repository root otherwise joins no CI job at all.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test cesium-entity-event-adapter.test.js cesium-mission-filter.test.js sdrpp-outcome.test.js node-picking.test.js

  sdrpp-lock-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require paired waterfall FFT acquire/release
        run: |
          grep -q 'bool fftBufferHeld' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.h
          grep -q 'fftBufferHeld = true' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp
          grep -q 'if (!fftBufferHeld) { return; }' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp
          grep -q 'fftBufferHeld = false' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp


  rtl-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Drives the deployed guard script against fake rtl_tcp servers and a
      # fake systemctl (stdlib only, no packages). It binds 127.0.0.1:1234 and
      # waits through the guard's own sleeps, so it takes about half a minute.
      # SSGUARD_TEST_REQUIRE_RUN makes the module's host-protection skip a
      # failure here; the checks after the run refuse a log with no tests in it
      # or any skip in it.
      - name: Run rtl_tcp watchdog tests
        env:
          SSGUARD_TEST_REQUIRE_RUN: "1"
        run: |
          set -o pipefail
          python deploy/rtl-watchdog/tests/test_ssguard.py 2>&1 | tee "$RUNNER_TEMP/ssguard.log"
          grep -Eq '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/ssguard.log"
          if grep -Eq 'skipped' "$RUNNER_TEMP/ssguard.log"; then
            echo "error: watchdog tests were skipped" >&2
            exit 1
          fi
