name: Repository Hygiene

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject hardcoded feed tokens
        run: tools/preflight_secret_scan.sh

  python-rf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RF test dependencies
        run: python -m pip install numpy flask Flask-Cors PyJWT requests
      # Globbed on purpose. A hand-maintained list is how test_rf_signal_family,
      # test_graphops_rf_antenna and test_graphops_rf_tune all shipped without CI
      # coverage; a new test module now joins the run by existing.
      - name: Run RF estimator, bridge and classifier tests
        run: python -m unittest -v test_rf_*.py test_graphops_rf_*.py

  python-graphops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GraphOps test dependencies
        run: python -m pip install numpy flask Flask-Cors PyJWT requests
      - name: Compile GraphOps Python modules
        run: python -m compileall -q rf_*.py graphops_rf_*.py rf_spectrum_contract.py graphops_full_fidelity.py scythe_orchestrator.py
      - name: Run GraphOps workbench tests
        run: python -m unittest -v test_graphops_workbench.py test_graphops_rf_ingest.py test_graphops_full_fidelity.py

  node-scythe-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scythe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scythe-web/package-lock.json
      - run: npm ci
      - run: npm test

  sdrpp-lock-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require paired waterfall FFT acquire/release
        run: |
          grep -q 'bool fftBufferHeld' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.h
          grep -q 'fftBufferHeld = true' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp
          grep -q 'if (!fftBufferHeld) { return; }' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp
          grep -q 'fftBufferHeld = false' assets/SDRPlusPlus-master/core/src/gui/widgets/waterfall.cpp
