<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCYTHE Password Reset</title>
    <link rel="stylesheet" href="/assets/css/auth.css">
    <script src="/assets/js/scythe_transport.js"></script>
    <script src="/assets/js/shared_auth.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="eyebrow">SCYTHE Broker Authentication</p>
        <h1>Reset password</h1>
        <p class="auth-copy">Enter your email or callsign. If an account matches, we will send a reset link.</p>
        <form id="forgotPasswordForm">
            <label for="loginId">Email or callsign</label>
            <input id="loginId" name="loginId" type="text" autocomplete="username" required>
            <button type="submit" id="submitBtn">Send reset link</button>
            <p id="statusMessage" role="status" aria-live="polite"></p>
        </form>
        <a class="back-link" href="/login.html">Back to sign in</a>
    </main>
    <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        button.disabled = true;
        status.className = 'loading';
        status.textContent = 'Sending...';
        try {
            const result = await SCYTHE_AUTH.requestPasswordReset(document.getElementById('loginId').value.trim());
            status.className = result.success ? 'success' : 'error';
            status.textContent = result.message || 'If an account matches, a password reset email is on its way.';
        } catch (error) {
            status.className = 'error';
            status.textContent = 'Unable to process the request right now.';
            button.disabled = false;
        }
    });
    </script>
</body>
</html>
