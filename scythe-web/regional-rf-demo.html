<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCYTHE // NTIA ITM Regional RF Demo</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #globe-root, #cesium-container { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#000; color:#ccefff; font-family:ui-monospace,monospace; }
    #globe-root { position:relative; }
    .notice {
      position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:50;
      padding:7px 12px; border:1px dashed #00d4ff; background:rgba(0,12,28,.86);
      color:#ccefff; font-size:11px; letter-spacing:.08em; pointer-events:none;
    }
    .directive {
      position:absolute; top:52px; right:12px; z-index:56; width:min(390px,calc(100vw - 24px));
      max-height:calc(100vh - 64px); overflow:auto; box-sizing:border-box; padding:7px 8px 8px;
      border:1px solid rgba(0,212,255,.55); background:rgba(0,12,28,.92);
      color:#ccefff; font:10px/1.35 ui-monospace,monospace; white-space:pre-wrap;
    }
    .directive[hidden] { display:none; }
    .directive-dismiss-layer { position:absolute; inset:0; z-index:55; background:transparent; }
    .directive-dismiss-layer[hidden] { display:none; }
    .directive__header { display:flex; min-height:22px; align-items:center; justify-content:space-between;
      gap:8px; padding-bottom:5px; border-bottom:1px dashed rgba(0,212,255,.3); }
    .directive__title { color:#66ddff; letter-spacing:.08em; }
    .directive__close { flex:0 0 22px; width:22px; height:22px; padding:0!important; color:#7f9bad!important;
      border-color:#24506a!important; font-size:15px!important; line-height:18px!important; cursor:pointer; }
    .directive__close:hover,.directive__close:focus-visible { color:#fff!important; border-color:#00d4ff!important;
      outline:none; box-shadow:0 0 9px rgba(0,212,255,.35); }
    .directive pre { white-space:pre-wrap; margin:5px 0; font:inherit; }
    .directive__controls { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:5px; }
    .directive__controls label { display:flex; align-items:center; gap:3px; color:#9eb6c7; white-space:nowrap; }
    .directive button,.directive input { color:#ccefff; background:#071422; border:1px solid #00d4ff;
      font:9px/1.2 ui-monospace,monospace; padding:3px 5px; box-sizing:border-box; }
    .directive button:disabled { color:#526674; border-color:#24404f; opacity:.7; }
    .directive input { width:56px; min-height:22px; }
    .directive input.wide { width:153px; }
    .directive__controls--actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .directive__controls--actions button { min-height:27px; white-space:normal; }
    .directive__analysis { margin-top:5px; padding-top:5px; border-top:1px dashed rgba(247,209,84,.45); color:#f7d154; }
    .directive__analysis[hidden] { display:none; }
    .live-hypergraph {
      position:absolute; left:12px; bottom:12px; z-index:54; width:min(460px,calc(100vw - 24px));
      min-width:min(320px,calc(100vw - 24px)); min-height:min(220px,calc(100vh - 24px));
      max-width:calc(100vw - 24px); max-height:calc(100vh - 24px);
      height:300px; border:1px solid rgba(0,212,255,.45); background:rgba(0,8,20,.9);
      display:grid; grid-template-rows:auto auto 1fr auto; box-sizing:border-box;
    }
    .live-hypergraph__status { padding:7px 30px 7px 9px; color:#ccefff; white-space:pre-wrap;
      font:10px/1.35 ui-monospace,monospace; border-bottom:1px dashed rgba(0,212,255,.3); }
    .live-hypergraph__resize { position:absolute; z-index:6; top:-1px; right:-1px; width:25px; height:25px;
      padding:0; border:1px solid rgba(0,212,255,.65); border-width:1px 1px 0 0;
      color:#66ddff; background:linear-gradient(225deg,rgba(0,212,255,.24),rgba(3,9,20,.92) 62%);
      font:13px/1 ui-monospace,monospace; cursor:nesw-resize; touch-action:none; }
    .live-hypergraph__resize:hover,.live-hypergraph__resize:focus-visible,
    .live-hypergraph__resize[data-dragging="true"] { color:#fff; outline:1px solid #00d4ff;
      outline-offset:-3px; box-shadow:0 0 12px rgba(0,212,255,.45); }
    .live-hypergraph__modes { display:flex; gap:5px; padding:5px 8px;
      border-bottom:1px dashed rgba(0,212,255,.25); }
    .live-hypergraph__modes button { color:#7f9bad; background:#071422; border:1px solid #24506a;
      font:9px ui-monospace,monospace; padding:3px 8px; cursor:pointer; }
    .live-hypergraph__modes button[aria-pressed="true"] { color:#ccefff; border-color:#00d4ff;
      box-shadow:inset 0 0 8px rgba(0,212,255,.18); }
    .live-hypergraph__viewport { position:relative; min-height:0; overflow:hidden; }
    .live-hypergraph__viewport[hidden] { display:none; }
    .live-hypergraph svg,.live-hypergraph__three { width:100%; height:100%; min-height:0; display:block; }
    .live-hypergraph__three { position:relative; }
    .live-hypergraph__node,.live-hypergraph__edge { cursor:pointer; }
    .live-hypergraph__edge { pointer-events:stroke; }
    .live-hypergraph__legend { padding:5px 9px; color:#7f9bad; font-size:9px;
      border-top:1px dashed rgba(0,212,255,.25); }
    .live-hypergraph__tooltip { position:absolute; z-index:3; max-width:300px; padding:5px 8px;
      color:#e9f8ff; background:rgba(3,9,20,.94); border:1px solid #00d4ff; border-radius:3px;
      font:9px/1.35 ui-monospace,monospace; white-space:pre-wrap; pointer-events:none; }
    .live-hypergraph__three-stats { position:absolute; top:6px; left:7px; color:#66ddff;
      font:8px ui-monospace,monospace; opacity:.78; pointer-events:none; }
    .world-stack { position:absolute; left:12px; top:52px; z-index:53; width:min(500px,calc(100vw - 24px));
      max-height:calc(100vh - 380px); overflow:auto; box-sizing:border-box; padding:9px;
      border:1px solid rgba(247,209,84,.55); background:rgba(5,10,22,.93); font:10px/1.4 ui-monospace,monospace; }
    .world-stack[hidden] { display:none; }
    .world-stack__title { color:#f7d154; margin-bottom:5px; }
    .world-stack__observed { color:#63ffd1; padding:5px; border:1px solid rgba(99,255,209,.35); }
    .world-stack__world { margin-top:5px; padding:5px; border:1px dashed rgba(247,209,84,.4); }
    .world-stack__world summary { color:#f7d154; cursor:pointer; }
    .world-stack__datum { color:#9eb6c7; margin-top:4px; }
    .world-stack__falsifier { color:#ff7890; margin-top:4px; }
    .world-stack__next { color:#63ffd1; margin-top:4px; }
    .world-stack__boundary { color:#ff7890; margin-top:7px; border-top:1px dashed #ff445e; padding-top:5px; }
    .selection-tray { color:#9eb6c7; border:1px dashed rgba(0,212,255,.3); padding:4px 5px; margin-top:5px;
      overflow-wrap:anywhere; }
    @media (max-width:800px) { .live-hypergraph { height:220px; width:320px; } }
  </style>
  <script type="importmap">

  </script>
</head>
<body>
  <main id="globe-root">
    <div id="cesium-container"></div>
    <div class="notice">SOLVER OUTPUT // DERIVED UINT16 VIEW // VISUALIZATION IS NOT AUTHORITATIVE</div>
    <aside id="live-hypergraph" class="live-hypergraph" aria-label="Live network hypergraph">
      <button class="live-hypergraph__resize" type="button" data-live-graph-resize aria-label="Resize live hypergraph">↗</button>
      <div class="live-hypergraph__status" data-live-graph-status>LIVE HYPERGRAPH // CONNECTING…</div>
      <div class="live-hypergraph__modes" role="group" aria-label="Hypergraph view mode">
        <button id="hypergraph-mode-3d" type="button" aria-pressed="true" disabled>3D CAUSAL CHAMBER</button>
        <button id="hypergraph-mode-2d" type="button" aria-pressed="false">2D ACCESSIBLE</button>
      </div>
      <div id="live-hypergraph-3d-viewport" class="live-hypergraph__viewport">
        <div class="live-hypergraph__three" data-live-graph-3d></div>
      </div>
      <div id="live-hypergraph-2d-viewport" class="live-hypergraph__viewport" hidden>
        <svg role="img" aria-label="Revision-pinned live hypergraph"></svg>
      </div>
      <div class="live-hypergraph__legend">TOPOLOGY // NOT GEOLOCATION · SHAPE + COLOR = EVIDENCE · CLICK NODE, EDGE, OR HYPEREDGE</div>
    </aside>
    <aside id="causal-world-stack" class="world-stack" aria-label="Causal hypothesis world stack" hidden></aside>
    <div id="directive-dismiss-layer" class="directive-dismiss-layer" aria-hidden="true" hidden></div>
    <aside id="graphops-directive" class="directive" aria-label="GraphOps directive controls" hidden>
      <div class="directive__header">
        <div id="directive-status" class="directive__title">GRAPHOPS DIRECTIVE</div>
        <button id="dismiss-directive" class="directive__close" type="button" aria-label="Dismiss GraphOps directive panel" title="Dismiss GraphOps panel (Escape)">×</button>
      </div>
      <div id="reality-prism"></div>
      <pre id="dsl-preview" class="directive__analysis" hidden></pre>
      <pre id="correlation-status" class="directive__analysis" hidden></pre>
      <div id="selection-tray" class="selection-tray">INVESTIGATION // NO SELECTION</div>
      <div class="directive__controls">
        <label>THRESHOLD <input id="threshold-value" type="number" value="145" step="1"></label>
        <button id="apply-threshold" type="button">APPLY LENS</button>
        <button id="undo-effects" type="button">UNDO</button>
      </div>
      <div class="directive__controls directive__controls--actions">
        <button id="execute-correlation" type="button" disabled>EXECUTE RF ↔ GRAPH</button>
        <button id="trace-provenance" type="button" disabled>TRACE PROVENANCE</button>
        <button id="expose-contradictions" type="button" disabled>EXPOSE CONTRADICTIONS</button>
        <button id="compare-worlds" type="button" disabled>COMPARE CAUSAL WORLDS</button>
      </div>
      <div class="directive__controls directive__controls--wrap">
        <label>FROM <input id="pin-from" class="wide" type="datetime-local" step="0.001"></label>
        <label>TO <input id="pin-to" class="wide" type="datetime-local" step="0.001"></label>
        <button id="execute-delta" type="button">GRAPH_DELTA</button>
      </div>
      <div class="directive__controls directive__controls--wrap">
        <label>SENSOR <input id="rf-sensor" value="manual-1"></label>
        <label>MHz <input id="rf-frequency" type="number" value="900" step="0.001"></label>
        <label>PEAK <input id="rf-peak" type="number" value="-45" step="1"></label>
        <label>NOISE <input id="rf-noise" type="number" value="-80" step="1"></label>
        <button id="ingest-rf" type="button">INGEST MEASURED RF</button>
      </div>
    </aside>
  </main>
  <script type="module">
    import { installScytheWeb } from "./browser-entry.js";
    import { regionalRfDemoConfig } from "./regionalRfDataset.js";
    import { SelectionModel } from "./selectionModel.js";
    import { EffectRuntime } from "./effectRuntime.js";
    import { registerVisualEffects } from "./visualEffects.js";
    import { GraphOverlayLayer } from "./graphOverlayLayer.js";
    import { LiveHypergraphView } from "./liveHypergraphView.js";
    import { LiveGraphController } from "./liveGraphController.js";
    import { LiveHypergraph3DView } from "./liveHypergraph3DView.js";
    import { ResizablePanel } from "./resizablePanel.js";
    import { InvestigationStore } from "./investigationStore.js";
    import { WorldStack } from "./worldStack.js";

    const viewerOptions = {
      animation: false,
      baseLayerPicker: false,
      baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/",
        maximumLevel: 17,
        credit: "Map data © OpenStreetMap contributors",
      })),
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      navigationHelpButton: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
    };
    const cesiumIonToken = String(window.CESIUM_ION_TOKEN || window.SCYTHE_CESIUM_ION_TOKEN || "").trim();
    if (cesiumIonToken) {
      Cesium.Ion.defaultAccessToken = cesiumIonToken;
      if (Cesium.Terrain?.fromWorldTerrain) {
        viewerOptions.terrain = Cesium.Terrain.fromWorldTerrain({requestVertexNormals: true, requestWaterMask: true});
      } else if (Cesium.createWorldTerrain) {
        viewerOptions.terrainProvider = Cesium.createWorldTerrain({requestVertexNormals: true, requestWaterMask: true});
      }
    } else {
      viewerOptions.terrainProvider = new Cesium.EllipsoidTerrainProvider();
    }
    const viewer = new Cesium.Viewer("cesium-container", viewerOptions);
    window.viewer = viewer;
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#071422");
    viewer.scene.globe.depthTestAgainstTerrain = false;
    const client = await installScytheWeb({
      ...regionalRfDemoConfig(),
      Cesium,
      resolveViewer: () => viewer,
      container: document.getElementById("globe-root"),
    });
    window.scytheWebClient = client;

    const directive = document.getElementById("graphops-directive");
    const directiveDismissLayer = document.getElementById("directive-dismiss-layer");
    const status = document.getElementById("directive-status");
    const showDirective = () => { directive.hidden = false; directiveDismissLayer.hidden = false; };
    const dismissDirective = () => { directive.hidden = true; directiveDismissLayer.hidden = true; };
    document.getElementById("dismiss-directive").addEventListener("click", dismissDirective);
    directiveDismissLayer.addEventListener("pointerdown", dismissDirective);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !directive.hidden) {
        dismissDirective(); event.preventDefault();
      }
    });
    const selections = new SelectionModel();
    const investigation = new InvestigationStore({storage: window.sessionStorage});
    const worldStack = new WorldStack({root: document.getElementById("causal-world-stack"), store: investigation});
    const effects = registerVisualEffects(new EffectRuntime(), {
      viewer, Cesium, prismRoot: document.getElementById("reality-prism"),
      dslRoot: document.getElementById("dsl-preview"),
      correlationRoot: document.getElementById("correlation-status"),
      worldStack,
    });
    const liveGraphController = new LiveGraphController();
    const graphOverlay = new GraphOverlayLayer({viewer, Cesium, container: document.getElementById("globe-root"),
      controller: liveGraphController});
    graphOverlay.start().catch((error) => {
      document.getElementById("correlation-status").hidden = false;
      document.getElementById("correlation-status").textContent = `GRAPH // UNAVAILABLE // ${error.message}`;
    });
    const liveRoot = document.getElementById("live-hypergraph");
    const livePanelResize = new ResizablePanel({panel: liveRoot,
      handle: liveRoot.querySelector("[data-live-graph-resize]")}).start();
    window.scytheLivePanelResize = livePanelResize;
    const liveHypergraph = new LiveHypergraphView({root: liveRoot, controller: liveGraphController});
    liveHypergraph.start().catch((error) => {
      document.querySelector("[data-live-graph-status]").textContent = `LIVE HYPERGRAPH // UNAVAILABLE // ${error.message}`;
    });
    window.scytheLiveHypergraph = liveHypergraph;
    let liveHypergraph3D = null;
    const mode3D = document.getElementById("hypergraph-mode-3d");
    const mode2D = document.getElementById("hypergraph-mode-2d");
    const viewport3D = document.getElementById("live-hypergraph-3d-viewport");
    const viewport2D = document.getElementById("live-hypergraph-2d-viewport");
    function setHypergraphMode(mode) {
      const show3D = mode === "3d" && liveHypergraph3D;
      viewport3D.hidden = !show3D; viewport2D.hidden = Boolean(show3D);
      mode3D.setAttribute("aria-pressed", String(Boolean(show3D)));
      mode2D.setAttribute("aria-pressed", String(!show3D));
      liveHypergraph3D?.setVisible(Boolean(show3D));
    }
    mode3D.addEventListener("click", () => setHypergraphMode("3d"));
    mode2D.addEventListener("click", () => setHypergraphMode("2d"));
    try {
      const [THREE, controlsModule] = await Promise.all([import("three"), import("three/addons/controls/OrbitControls.js")]);
      liveHypergraph3D = new LiveHypergraph3DView({root: liveRoot, controller: liveGraphController,
        THREE, OrbitControls: controlsModule.OrbitControls});
      await liveHypergraph3D.start(); mode3D.disabled = false; setHypergraphMode("3d");
      window.scytheLiveHypergraph3D = liveHypergraph3D;
    } catch (error) {
      mode3D.disabled = true; setHypergraphMode("2d");
      document.querySelector("[data-live-graph-status]").textContent += `\n3D // UNAVAILABLE // SVG FALLBACK // ${error.message}`;
    }
    const localDateTime = (date) => {
      const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return shifted.toISOString().slice(0, 23);
    };
    document.getElementById("pin-from").value = localDateTime(new Date(Date.now() - 60_000));
    document.getElementById("pin-to").value = localDateTime(new Date());
    let activePlanId = null;

    function updateInvestigation() {
      const graphSelection = selections.items.find((item) => ["graph-node", "graph-edge", "event"].includes(item.kind));
      investigation.captureSelections(selections.items, graphSelection?.graphRevision ?? liveGraphController.graphRevision);
      const labels = selections.items.map((item) => item.kind === "rf-cell"
        ? `RF:${item.tileId}` : item.kind === "time-pin"
          ? `TIME:${new Date(item.timestamp * 1000).toISOString()}` : `${item.kind.toUpperCase()}:${item.entityId}`);
      document.getElementById("selection-tray").textContent = `INVESTIGATION // ${labels.join(" // ") || "NO SELECTION"}`;
      const kinds = new Set(selections.items.map((item) => item.kind));
      document.getElementById("compare-worlds").disabled = !(kinds.has("rf-cell") &&
        (["graph-node", "graph-edge", "event"].some((kind) => kinds.has(kind))));
    }

    function captureTimePins() {
      const from = new Date(document.getElementById("pin-from").value).getTime() / 1000;
      const to = new Date(document.getElementById("pin-to").value).getTime() / 1000;
      if (!Number.isFinite(from) || !Number.isFinite(to) || from === to) return false;
      selections.upsert({kind: "time-pin", timestamp: from, clockId: "UTC", uncertaintyMilliseconds: 0});
      selections.upsert({kind: "time-pin", timestamp: to, clockId: "UTC", uncertaintyMilliseconds: 0});
      updateInvestigation(); return true;
    }

    async function submitDirective(request) {
      const response = await fetch(`/api/graphops/directives/${request.requestedMode}`, {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(request),
      });
      const plan = await response.json();
      if (!response.ok) throw new Error(plan.error ?? `HTTP ${response.status}`);
      if (activePlanId) await effects.revertPlan(activePlanId);
      await effects.applyPlan(plan);
      activePlanId = plan.planId;
      investigation.recordPlan(plan);
      status.textContent = `GRAPHOPS // ${plan.status.toUpperCase()} // ${plan.evidencePosture.toUpperCase()}`;
      return plan;
    }

    document.getElementById("globe-root").addEventListener(
      "scythe-web:coverage-cell-selected", async ({ detail: sample }) => {
        showDirective();
        status.textContent = "GRAPHOPS // RESOLVING AUTHORITATIVE CELL…";
        selections.replace({
          kind: "rf-cell", datasetId: sample.dataset_id, tileId: sample.tile_id,
          longitudeDegrees: sample.longitude_degrees, latitudeDegrees: sample.latitude_degrees,
          displayValue: sample.value, displayUnits: sample.units,
          ...(sample.display_asset_hash ? { displayAssetHash: sample.display_asset_hash } : {}),
          coverageThreshold: { value: sample.coverage_threshold,
            units: sample.coverage_threshold_units, comparison: sample.coverage_comparison },
        });
        updateInvestigation();
        try {
          await submitDirective(selections.directiveRequest({
            directive: "explain.coverage-cell", utterance: "Explain why this cell is red", mode: "preview",
          }));
        } catch (error) {
          status.textContent = `GRAPHOPS // UNAVAILABLE // ${error.message}`;
        }
      },
    );
    document.getElementById("globe-root").addEventListener("scythe-web:graph-selection", async ({detail}) => {
      showDirective();
      selections.upsert(detail);
      updateInvestigation();
      const hasRf = selections.items.some((item) => item.kind === "rf-cell");
      document.getElementById("execute-correlation").disabled = !hasRf;
      document.getElementById("trace-provenance").disabled = false;
      document.getElementById("expose-contradictions").disabled = false;
      if (document.getElementById("execute-correlation").disabled) return;
      try {
        await submitDirective(selections.directiveRequest({directive: "correlate.rf-cell-graph",
          utterance: "Connect this RF cell to this graph node", mode: "preview"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("globe-root").addEventListener("scythe-web:graph-status", ({detail}) => {
      if (detail.status === "empty" || detail.status === "unavailable") {
        document.getElementById("correlation-status").hidden = false;
        document.getElementById("correlation-status").textContent = `GRAPH // ${detail.status.toUpperCase()}\n${detail.message ?? detail.reason ?? "No graph data"}`;
      }
    });
    document.getElementById("apply-threshold").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({
          directive: "reclassify.coverage-threshold", utterance: "Reclassify coverage at this threshold",
          parameters: { threshold: Number(document.getElementById("threshold-value").value), units: "dB", comparison: "LTE" },
          mode: "execute",
        }));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("undo-effects").addEventListener("click", async () => {
      if (activePlanId) await effects.revertPlan(activePlanId);
      activePlanId = null;
      status.textContent = "GRAPHOPS // EFFECTS REVERTED";
    });
    document.getElementById("execute-correlation").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "correlate.rf-cell-graph",
          utterance: "Execute the bounded RF correlation plan", mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("trace-provenance").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "trace.provenance-impact",
          utterance: "Trace bounded provenance impact from this graph entity",
          parameters: {depth: 3, limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("expose-contradictions").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "expose.contradictions",
          utterance: "Expose contradictions without synthesizing consensus",
          parameters: {limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("execute-delta").addEventListener("click", async () => {
      if (!captureTimePins()) {
        status.textContent = "GRAPHOPS // REFUSED // Two valid time pins are required"; return;
      }
      try {
        await submitDirective(selections.directiveRequest({directive: "compare.graph-delta",
          utterance: "Compare the graph between these two UTC pins", parameters: {limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("compare-worlds").addEventListener("click", async () => {
      try {
        if (!captureTimePins()) throw new Error("Two distinct valid time pins are required");
        await submitDirective(selections.directiveRequest({directive: "compare.causal-worlds",
          utterance: "Determine what must be true for this RF coverage gap and network burst to share a cause",
          parameters: {limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `CAUSAL WORLDS // REFUSED // ${error.message}`; }
    });
    document.getElementById("ingest-rf").addEventListener("click", async () => {
      const frequency = Number(document.getElementById("rf-frequency").value) * 1e6;
      const payload = {sensor_id: document.getElementById("rf-sensor").value,
        sequence: Date.now(), timestamp: Date.now() / 1000, center_frequency_hz: frequency,
        peak_frequency_hz: frequency, sample_rate_hz: 2_400_000,
        peak_dbfs: Number(document.getElementById("rf-peak").value),
        noise_floor_dbfs: Number(document.getElementById("rf-noise").value)};
      try {
        const response = await fetch("/api/graphops/rf-observations", {method: "POST",
          credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
        document.getElementById("correlation-status").hidden = false;
        document.getElementById("correlation-status").textContent = `MEASURED RF // ${result.status.toUpperCase()}\nAUTHORITY // ${result.authority}\nEVIDENCE // ${result.observation?.evidence_id ?? "FILTERED"}\nRAW IQ // REJECTED BY CONTRACT`;
      } catch (error) { status.textContent = `RF INGEST // REJECTED // ${error.message}`; }
    });
  </script>
</body>
</html>
