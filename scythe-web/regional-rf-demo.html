<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCYTHE // NTIA ITM Regional RF Demo</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #globe-root, #cesium-container { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#000; color:#ccefff; font-family:ui-monospace,monospace; }
    #globe-root { position:relative; }
    .notice {
      position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:50;
      padding:7px 12px; border:1px dashed #00d4ff; background:rgba(0,12,28,.86);
      color:#ccefff; font-size:11px; letter-spacing:.08em; pointer-events:none;
    }
    .directive {
      position:absolute; top:52px; right:12px; z-index:55; width:min(430px,calc(100vw - 24px));
      padding:10px 12px; border:1px solid rgba(0,212,255,.55); background:rgba(0,12,28,.9);
      color:#ccefff; font:11px/1.45 ui-monospace,monospace; white-space:pre-wrap;
    }
    .directive[hidden] { display:none; }
    .directive pre { white-space:pre-wrap; margin:8px 0; font:inherit; }
    .directive__controls { display:flex; gap:6px; align-items:center; margin-top:8px; }
    .directive button,.directive input { color:#ccefff; background:#071422; border:1px solid #00d4ff; font:inherit; padding:4px 6px; }
    .directive input { width:64px; }
    .directive input.wide { width:176px; }
    .directive__controls--wrap { flex-wrap:wrap; }
    .directive__analysis { margin-top:8px; padding-top:7px; border-top:1px dashed rgba(247,209,84,.45); color:#f7d154; }
    .directive__analysis[hidden] { display:none; }
    .live-hypergraph {
      position:absolute; left:12px; bottom:12px; z-index:54; width:min(460px,calc(100vw - 24px));
      height:300px; border:1px solid rgba(0,212,255,.45); background:rgba(0,8,20,.9);
      display:grid; grid-template-rows:auto 1fr auto; box-sizing:border-box;
    }
    .live-hypergraph__status { padding:7px 9px; color:#ccefff; white-space:pre-wrap;
      font:10px/1.35 ui-monospace,monospace; border-bottom:1px dashed rgba(0,212,255,.3); }
    .live-hypergraph svg { width:100%; height:100%; min-height:0; }
    .live-hypergraph__node,.live-hypergraph__edge { cursor:pointer; }
    .live-hypergraph__edge { pointer-events:stroke; }
    .live-hypergraph__legend { padding:5px 9px; color:#7f9bad; font-size:9px;
      border-top:1px dashed rgba(0,212,255,.25); }
    @media (max-width:800px) { .live-hypergraph { height:220px; width:320px; } }
  </style>
</head>
<body>
  <main id="globe-root">
    <div id="cesium-container"></div>
    <div class="notice">SOLVER OUTPUT // DERIVED UINT16 VIEW // VISUALIZATION IS NOT AUTHORITATIVE</div>
    <aside id="live-hypergraph" class="live-hypergraph" aria-label="Live network hypergraph">
      <div class="live-hypergraph__status" data-live-graph-status>LIVE HYPERGRAPH // CONNECTING…</div>
      <svg role="img" aria-label="Revision-pinned live hypergraph"></svg>
      <div class="live-hypergraph__legend">NETWORK LAYOUT // NOT GEOLOCATION · OBSERVED SOLID · INFERRED DASHED · CLICK NODE OR EDGE</div>
    </aside>
    <aside id="graphops-directive" class="directive" hidden>
      <div id="directive-status">GRAPHOPS DIRECTIVE</div>
      <div id="reality-prism"></div>
      <pre id="dsl-preview" class="directive__analysis" hidden></pre>
      <pre id="correlation-status" class="directive__analysis" hidden></pre>
      <div class="directive__controls">
        <label>THRESHOLD <input id="threshold-value" type="number" value="145" step="1"></label>
        <button id="apply-threshold" type="button">APPLY LENS</button>
        <button id="undo-effects" type="button">UNDO</button>
      </div>
      <div class="directive__controls">
        <button id="execute-correlation" type="button" disabled>EXECUTE RF ↔ GRAPH</button>
        <button id="trace-provenance" type="button" disabled>TRACE PROVENANCE</button>
        <button id="expose-contradictions" type="button" disabled>EXPOSE CONTRADICTIONS</button>
      </div>
      <div class="directive__controls directive__controls--wrap">
        <label>FROM <input id="pin-from" class="wide" type="datetime-local" step="0.001"></label>
        <label>TO <input id="pin-to" class="wide" type="datetime-local" step="0.001"></label>
        <button id="execute-delta" type="button">GRAPH_DELTA</button>
      </div>
      <div class="directive__controls directive__controls--wrap">
        <label>SENSOR <input id="rf-sensor" value="manual-1"></label>
        <label>MHz <input id="rf-frequency" type="number" value="900" step="0.001"></label>
        <label>PEAK <input id="rf-peak" type="number" value="-45" step="1"></label>
        <label>NOISE <input id="rf-noise" type="number" value="-80" step="1"></label>
        <button id="ingest-rf" type="button">INGEST MEASURED RF</button>
      </div>
    </aside>
  </main>
  <script type="module">
    import { installScytheWeb } from "./browser-entry.js";
    import { regionalRfDemoConfig } from "./regionalRfDataset.js";
    import { SelectionModel } from "./selectionModel.js";
    import { EffectRuntime } from "./effectRuntime.js";
    import { registerVisualEffects } from "./visualEffects.js";
    import { GraphOverlayLayer } from "./graphOverlayLayer.js";
    import { LiveHypergraphView } from "./liveHypergraphView.js";

    const viewerOptions = {
      animation: false,
      baseLayerPicker: false,
      baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/",
        maximumLevel: 17,
        credit: "Map data © OpenStreetMap contributors",
      })),
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      navigationHelpButton: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
    };
    const cesiumIonToken = String(window.CESIUM_ION_TOKEN || window.SCYTHE_CESIUM_ION_TOKEN || "").trim();
    if (cesiumIonToken) {
      Cesium.Ion.defaultAccessToken = cesiumIonToken;
      if (Cesium.Terrain?.fromWorldTerrain) {
        viewerOptions.terrain = Cesium.Terrain.fromWorldTerrain({requestVertexNormals: true, requestWaterMask: true});
      } else if (Cesium.createWorldTerrain) {
        viewerOptions.terrainProvider = Cesium.createWorldTerrain({requestVertexNormals: true, requestWaterMask: true});
      }
    } else {
      viewerOptions.terrainProvider = new Cesium.EllipsoidTerrainProvider();
    }
    const viewer = new Cesium.Viewer("cesium-container", viewerOptions);
    window.viewer = viewer;
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#071422");
    viewer.scene.globe.depthTestAgainstTerrain = false;
    const client = await installScytheWeb({
      ...regionalRfDemoConfig(),
      Cesium,
      resolveViewer: () => viewer,
      container: document.getElementById("globe-root"),
    });
    window.scytheWebClient = client;

    const directive = document.getElementById("graphops-directive");
    const status = document.getElementById("directive-status");
    const selections = new SelectionModel();
    const effects = registerVisualEffects(new EffectRuntime(), {
      viewer, Cesium, prismRoot: document.getElementById("reality-prism"),
      dslRoot: document.getElementById("dsl-preview"),
      correlationRoot: document.getElementById("correlation-status"),
    });
    const graphOverlay = new GraphOverlayLayer({viewer, Cesium, container: document.getElementById("globe-root")});
    graphOverlay.start().catch((error) => {
      document.getElementById("correlation-status").hidden = false;
      document.getElementById("correlation-status").textContent = `GRAPH // UNAVAILABLE // ${error.message}`;
    });
    const liveHypergraph = new LiveHypergraphView({root: document.getElementById("live-hypergraph")});
    liveHypergraph.start().catch((error) => {
      document.querySelector("[data-live-graph-status]").textContent = `LIVE HYPERGRAPH // UNAVAILABLE // ${error.message}`;
    });
    window.scytheLiveHypergraph = liveHypergraph;
    const localDateTime = (date) => {
      const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return shifted.toISOString().slice(0, 23);
    };
    document.getElementById("pin-from").value = localDateTime(new Date(Date.now() - 60_000));
    document.getElementById("pin-to").value = localDateTime(new Date());
    let activePlanId = null;

    async function submitDirective(request) {
      const response = await fetch(`/api/graphops/directives/${request.requestedMode}`, {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(request),
      });
      const plan = await response.json();
      if (!response.ok) throw new Error(plan.error ?? `HTTP ${response.status}`);
      if (activePlanId) await effects.revertPlan(activePlanId);
      await effects.applyPlan(plan);
      activePlanId = plan.planId;
      status.textContent = `GRAPHOPS // ${plan.status.toUpperCase()} // ${plan.evidencePosture.toUpperCase()}`;
      return plan;
    }

    document.getElementById("globe-root").addEventListener(
      "scythe-web:coverage-cell-selected", async ({ detail: sample }) => {
        directive.hidden = false;
        status.textContent = "GRAPHOPS // RESOLVING AUTHORITATIVE CELL…";
        selections.replace({
          kind: "rf-cell", datasetId: sample.dataset_id, tileId: sample.tile_id,
          longitudeDegrees: sample.longitude_degrees, latitudeDegrees: sample.latitude_degrees,
          displayValue: sample.value, displayUnits: sample.units,
          ...(sample.display_asset_hash ? { displayAssetHash: sample.display_asset_hash } : {}),
          coverageThreshold: { value: sample.coverage_threshold,
            units: sample.coverage_threshold_units, comparison: sample.coverage_comparison },
        });
        try {
          await submitDirective(selections.directiveRequest({
            directive: "explain.coverage-cell", utterance: "Explain why this cell is red", mode: "preview",
          }));
        } catch (error) {
          status.textContent = `GRAPHOPS // UNAVAILABLE // ${error.message}`;
        }
      },
    );
    document.getElementById("globe-root").addEventListener("scythe-web:graph-selection", async ({detail}) => {
      directive.hidden = false;
      selections.upsert(detail);
      const hasRf = selections.items.some((item) => item.kind === "rf-cell");
      document.getElementById("execute-correlation").disabled = !hasRf;
      document.getElementById("trace-provenance").disabled = false;
      document.getElementById("expose-contradictions").disabled = false;
      if (document.getElementById("execute-correlation").disabled) return;
      try {
        await submitDirective(selections.directiveRequest({directive: "correlate.rf-cell-graph",
          utterance: "Connect this RF cell to this graph node", mode: "preview"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("globe-root").addEventListener("scythe-web:graph-status", ({detail}) => {
      if (detail.status === "empty" || detail.status === "unavailable") {
        document.getElementById("correlation-status").hidden = false;
        document.getElementById("correlation-status").textContent = `GRAPH // ${detail.status.toUpperCase()}\n${detail.message ?? detail.reason ?? "No graph data"}`;
      }
    });
    document.getElementById("apply-threshold").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({
          directive: "reclassify.coverage-threshold", utterance: "Reclassify coverage at this threshold",
          parameters: { threshold: Number(document.getElementById("threshold-value").value), units: "dB", comparison: "LTE" },
          mode: "execute",
        }));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("undo-effects").addEventListener("click", async () => {
      if (activePlanId) await effects.revertPlan(activePlanId);
      activePlanId = null;
      status.textContent = "GRAPHOPS // EFFECTS REVERTED";
    });
    document.getElementById("execute-correlation").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "correlate.rf-cell-graph",
          utterance: "Execute the bounded RF correlation plan", mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("trace-provenance").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "trace.provenance-impact",
          utterance: "Trace bounded provenance impact from this graph entity",
          parameters: {depth: 3, limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("expose-contradictions").addEventListener("click", async () => {
      try {
        await submitDirective(selections.directiveRequest({directive: "expose.contradictions",
          utterance: "Expose contradictions without synthesizing consensus",
          parameters: {limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("execute-delta").addEventListener("click", async () => {
      const from = new Date(document.getElementById("pin-from").value).getTime() / 1000;
      const to = new Date(document.getElementById("pin-to").value).getTime() / 1000;
      if (!Number.isFinite(from) || !Number.isFinite(to)) {
        status.textContent = "GRAPHOPS // REFUSED // Two valid time pins are required"; return;
      }
      selections.upsert({kind: "time-pin", timestamp: from, clockId: "UTC", uncertaintyMilliseconds: 0});
      selections.upsert({kind: "time-pin", timestamp: to, clockId: "UTC", uncertaintyMilliseconds: 0});
      try {
        await submitDirective(selections.directiveRequest({directive: "compare.graph-delta",
          utterance: "Compare the graph between these two UTC pins", parameters: {limit: 100}, mode: "execute"}));
      } catch (error) { status.textContent = `GRAPHOPS // REFUSED // ${error.message}`; }
    });
    document.getElementById("ingest-rf").addEventListener("click", async () => {
      const frequency = Number(document.getElementById("rf-frequency").value) * 1e6;
      const payload = {sensor_id: document.getElementById("rf-sensor").value,
        sequence: Date.now(), timestamp: Date.now() / 1000, center_frequency_hz: frequency,
        peak_frequency_hz: frequency, sample_rate_hz: 2_400_000,
        peak_dbfs: Number(document.getElementById("rf-peak").value),
        noise_floor_dbfs: Number(document.getElementById("rf-noise").value)};
      try {
        const response = await fetch("/api/graphops/rf-observations", {method: "POST",
          credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
        document.getElementById("correlation-status").hidden = false;
        document.getElementById("correlation-status").textContent = `MEASURED RF // ${result.status.toUpperCase()}\nAUTHORITY // ${result.authority}\nEVIDENCE // ${result.observation?.evidence_id ?? "FILTERED"}\nRAW IQ // REJECTED BY CONTRACT`;
      } catch (error) { status.textContent = `RF INGEST // REJECTED // ${error.message}`; }
    });
  </script>
</body>
</html>
