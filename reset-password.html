<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCYTHE Set New Password</title>
    <link rel="stylesheet" href="/assets/css/auth.css">
    <script src="/assets/js/scythe_transport.js"></script>
    <script src="/assets/js/shared_auth.js"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <p class="eyebrow">SCYTHE Broker Authentication</p>
        <h1>Set new password</h1>
        <p class="auth-copy">Choose a new password for your operator account.</p>
        <form id="resetPasswordForm">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" required>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required>
            <button type="submit" id="submitBtn">Update password</button>
            <p id="statusMessage" role="status" aria-live="polite"></p>
        </form>
        <a class="back-link" href="/login.html">Back to sign in</a>
    </main>
    <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const params = new URLSearchParams(window.location.search);
        const changePasswordId = params.get('changePasswordId') || params.get('change_password_id') || params.get('token');
        const password = document.getElementById('newPassword').value;
        const confirmation = document.getElementById('confirmPassword').value;
        const button = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        if (!changePasswordId) {
            status.className = 'error';
            status.textContent = 'This reset link is missing its token.';
            return;
        }
        if (password !== confirmation) {
            status.className = 'error';
            status.textContent = 'Passwords do not match.';
            return;
        }
        button.disabled = true;
        status.className = 'loading';
        status.textContent = 'Updating...';
        try {
            const result = await SCYTHE_AUTH.completePasswordReset(changePasswordId, password);
            status.className = result.success ? 'success' : 'error';
            status.textContent = result.message || 'Unable to update password.';
            if (result.success) {
                setTimeout(() => { window.location.href = '/login.html'; }, 1800);
            } else {
                button.disabled = false;
            }
        } catch (error) {
            status.className = 'error';
            status.textContent = 'Unable to process the reset link.';
            button.disabled = false;
        }
    });
    </script>
</body>
</html>
